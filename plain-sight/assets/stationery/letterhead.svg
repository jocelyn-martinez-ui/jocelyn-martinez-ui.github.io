<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="#f5f2ec"/><text x="62" y="112" font-family="Georgia" font-size="54" fill="#252321">PLAIN SIGHT</text><path d="M62 138H732" stroke="#252321"/><text x="62" y="196" font-family="Arial" font-size="14" letter-spacing="3" fill="#793b43">STUDIO NOTES / CONCEPT EDITION</text><text x="62" y="310" font-family="Georgia" font-style="italic" font-size="47" fill="#252321">To whom it may concern,</text><text x="62" y="421" font-family="Arial" font-size="18" fill="#252321">A considered image begins with a clear brief.</text><text x="62" y="463" font-family="Arial" font-size="18" fill="#252321">This is a portfolio stationery specimen.</text><text x="62" y="505" font-family="Arial" font-size="18" fill="#252321">It does not represent a real studio letter.</text><path d="M62 977H732" stroke="#252321"/><text x="62" y="1013" font-family="Arial" font-size="13" fill="#252321">PLAIN SIGHT / THE ORDINARY, OBSERVED DIFFERENTLY.</text></svg>