<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROOF Motion Prototype / From image to idea</title><style>*{box-sizing:border-box}body{margin:0;background:#121312;color:#f2efe8;font:16px Arial,Helvetica,sans-serif}.stage{position:relative;width:min(96vw,780px);aspect-ratio:4/5;margin:2rem auto;overflow:hidden;background:#181917;border:1px solid #666}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.7) contrast(1.1);animation:photoMove 8s ease-in-out infinite alternate}.layer{position:absolute;left:5%;right:5%;bottom:9%;background:#ff542d;padding:4%;transform:translateY(125%);animation:enter 8s cubic-bezier(.2,.7,.1,1) infinite}.title{font-size:clamp(28px,8vw,88px);letter-spacing:-.08em;font-weight:900;line-height:.92;margin:0;color:#181917;animation:ink 8s steps(1,end) infinite}.meta{position:absolute;left:5%;top:5%;right:5%;display:flex;justify-content:space-between;font:700 clamp(10px,1.6vw,17px) monospace;letter-spacing:1px}.tag{margin:0 5%;font:13px/1.6 monospace;max-width:620px}.controls{width:min(96vw,780px);margin:auto;display:flex;justify-content:space-between;gap:10px;align-items:center}.controls button{background:#dbfa36;color:#181917;font:700 13px monospace;padding:12px;border:0;cursor:pointer}.pause .photo,.pause .layer,.pause .title{animation-play-state:paused}@keyframes photoMove{0%{transform:scale(1.15);filter:grayscale(1) contrast(1.1)}50%{transform:scale(1.05) translateX(-1%)}100%{transform:scale(1);filter:grayscale(.4)}}@keyframes enter{0%,17%{transform:translateY(125%)}29%,78%{transform:translateY(0)}100%{transform:translateY(-125%)}}@keyframes ink{0%,20%{opacity:0}21%,100%{opacity:1}}@media(prefers-reduced-motion:reduce){.photo,.layer,.title{animation:none;transform:none}.photo{filter:none}}</style></head><body><div class="stage" id="stage"><img class="photo" src="../assets/contact-sheet.webp" alt="Original PROOF art-directed conceptual print photography"><div class="meta"><span>PROOF / MOTION EXPERIMENT</span><span>8 SEC LOOP / 01</span></div><div class="layer"><h1 class="title">LOOK CLOSER.</h1></div></div><div class="controls"><p class="tag">Contact-sheet to editorial message. Browser animation with reduced-motion fallback. No encoded MP4 or tested social-video export is claimed.</p><button id="toggle" type="button" aria-pressed="false">PAUSE MOTION</button></div><script>const s=document.getElementById('stage'),b=document.getElementById('toggle');b.addEventListener('click',()=>{const paused=s.classList.toggle('pause');b.setAttribute('aria-pressed',String(paused));b.textContent=paused?'PLAY MOTION':'PAUSE MOTION'})</script></body></html>
