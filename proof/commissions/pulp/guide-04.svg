<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img"><title>PULP Brand Standards 04: TYPE HIERARCHY</title><rect x="0" y="0" width="210" height="297" fill="#F6EDDE"/><text x="14" y="17" fill="#203F3D" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="900" letter-spacing="-1">PULP.</text><text x="196" y="15" fill="#203F3D" font-family="monospace" font-size="3.2" text-anchor="end">BRAND STANDARD / 04—12</text><path d="M14 24H196M14 277H196" stroke="#203F3D" stroke-width=".45"/><text x="14" y="42" fill="#203F3D" font-family="monospace" font-size="4" >TYPE HIERARCHY</text><text x="14" y="64" fill="#203F3D" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="900" letter-spacing="-.75">LARGE / SMALL / CLEAR.</text><rect x="14" y="87" width="182" height="151" fill="#E4D9C8"/><text x="22" y="135" fill="#203F3D" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="900" letter-spacing="-1.7">COLOUR.</text><text x="22" y="165" fill="#C85243" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="900">PRINT + MIX.</text><text x="22" y="188" fill="#203F3D" font-family="monospace" font-size="4" >INK COLLECTION / 01 / INFORMATION</text><text x="22" y="211" fill="#203F3D" font-family="Arial,Helvetica,sans-serif" font-size="6" >Small copy stays readable.</text><text x="14" y="253" fill="#203F3D" font-family="Arial,Helvetica,sans-serif" font-size="4.7" >Display sans for impact, readable supporting copy, mono for specs.</text><text x="14" y="286" fill="#203F3D" font-family="monospace" font-size="2.8" >CREATIVE STUDY / FICTIONAL / EDITABLE VECTOR</text><text x="196" y="286" fill="#203F3D" font-family="monospace" font-size="2.8" text-anchor="end">04</text></svg>