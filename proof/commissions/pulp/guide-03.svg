<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img"><title>PULP Brand Standards 03: WORDMARK RULES</title><rect x="0" y="0" width="210" height="297" fill="#F6EDDE"/><text x="14" y="17" fill="#203F3D" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="900" letter-spacing="-1">PULP.</text><text x="196" y="15" fill="#203F3D" font-family="monospace" font-size="3.2" text-anchor="end">BRAND STANDARD / 03—12</text><path d="M14 24H196M14 277H196" stroke="#203F3D" stroke-width=".45"/><text x="14" y="42" fill="#203F3D" font-family="monospace" font-size="4" >WORDMARK RULES</text><text x="14" y="64" fill="#203F3D" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="900" letter-spacing="-.75">GIVE THE MARK ROOM.</text><rect x="14" y="87" width="182" height="151" fill="#E1D8CB"/><rect x="29" y="107" width="152" height="89" fill="none" stroke="#C85243" stroke-width="1" stroke-dasharray="3 3"/><rect x="41" y="120" width="129" height="62" fill="#F6EDDE"/><text x="48" y="161" fill="#203F3D" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="900" letter-spacing="-2">PULP.</text><text x="31" y="104" fill="#C85243" font-family="monospace" font-size="3.5" >1x MINIMUM</text><text x="41" y="211" fill="#203F3D" font-family="monospace" font-size="4" >Maintain clear space around the wordmark.</text><text x="14" y="253" fill="#203F3D" font-family="Arial,Helvetica,sans-serif" font-size="4.7" >Protect clear space equal to a letter height; never stretch the mark.</text><text x="14" y="286" fill="#203F3D" font-family="monospace" font-size="2.8" >CREATIVE STUDY / FICTIONAL / EDITABLE VECTOR</text><text x="196" y="286" fill="#203F3D" font-family="monospace" font-size="2.8" text-anchor="end">03</text></svg>