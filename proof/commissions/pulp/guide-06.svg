<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img"><title>PULP Brand Standards 06: INK & OVERPRINT</title><rect x="0" y="0" width="210" height="297" fill="#F6EDDE"/><text x="14" y="17" fill="#203F3D" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="900" letter-spacing="-1">PULP.</text><text x="196" y="15" fill="#203F3D" font-family="monospace" font-size="3.2" text-anchor="end">BRAND STANDARD / 06—12</text><path d="M14 24H196M14 277H196" stroke="#203F3D" stroke-width=".45"/><text x="14" y="42" fill="#203F3D" font-family="monospace" font-size="4" >INK &amp; OVERPRINT</text><text x="14" y="64" fill="#203F3D" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="900" letter-spacing="-.75">ONE + ONE = MORE.</text><defs><pattern id="dot" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="2" r="1" fill="#203F3D"/></pattern></defs><rect x="14" y="87" width="182" height="151" fill="#E6ABA4"/><circle cx="98" cy="163" r="59" fill="#C85243"/><circle cx="126" cy="158" r="52" fill="#F2C65A" opacity=".8"/><circle cx="117" cy="158" r="44" fill="url(#dot)" opacity=".75"/><text x="14" y="253" fill="#203F3D" font-family="Arial,Helvetica,sans-serif" font-size="4.7" >Two transparent layers can create a third visual relationship.</text><text x="14" y="286" fill="#203F3D" font-family="monospace" font-size="2.8" >CREATIVE STUDY / FICTIONAL / EDITABLE VECTOR</text><text x="196" y="286" fill="#203F3D" font-family="monospace" font-size="2.8" text-anchor="end">06</text></svg>