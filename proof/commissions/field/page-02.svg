<svg xmlns="http://www.w3.org/2000/svg" width="148mm" height="210mm" viewBox="0 0 148 210" role="img"><title>FIELD journal issue 01 page 02 — HOW TO LOOK CLOSELY</title><rect x="0" y="0" width="148" height="210" fill="#F1EDE2"/><path d="M14 18H134M14 192H134" stroke="#293D33" stroke-width=".35" opacity=".8"/><text x="14" y="12" fill="#293D33" font-family="Consolas,monospace" font-size="2.65" >FIELD / MATERIAL &amp; MARK / ISSUE 01</text><text x="134" y="12" fill="#293D33" font-family="Consolas,monospace" font-size="2.75" text-anchor="end">02 / 12</text><g transform="translate(126 154) scale(0.55)" fill="none" stroke="#697E65"><path d="M0 0Q-7 -25 -24 -53Q-36 -80 -15 -96Q14 -84 14 -54Q12 -25 0 0Z" fill="#697E65" fill-opacity=".16" stroke-width="1.5"/><path d="M0 0Q-8 -55 -15 -96M-9 -36L-27 -52M-8 -46L4 -64M-11 -60L-27 -77M-13 -74L4 -81" stroke-width=".8"/></g><text x="15" y="89" fill="#293D33" font-family="Georgia,'Times New Roman',serif" font-size="7.2" >Looking closely is not a neutral act.</text><text x="15" y="106" fill="#293D33" font-family="Georgia,'Times New Roman',serif" font-size="4.6" >It requires slowing the eye, looking at edges,</text><text x="15" y="114" fill="#293D33" font-family="Georgia,'Times New Roman',serif" font-size="4.6" >and asking what a mark can tell us about</text><text x="15" y="122" fill="#293D33" font-family="Georgia,'Times New Roman',serif" font-size="4.6" >the material and the hand that changed it.</text><text x="15" y="130" fill="#293D33" font-family="Georgia,'Times New Roman',serif" font-size="4.6" ></text><text x="15" y="138" fill="#293D33" font-family="Georgia,'Times New Roman',serif" font-size="4.6" >In this issue, we study surface, weight</text><text x="15" y="146" fill="#293D33" font-family="Georgia,'Times New Roman',serif" font-size="4.6" >and the record of small decisions.</text><text x="14" y="35" fill="#293D33" font-family="Consolas,monospace" font-size="3.4" >EDITOR'S LETTER</text><text x="14" y="51" fill="#293D33" font-family="Georgia,'Times New Roman',serif" font-size="9" >HOW TO LOOK CLOSELY</text><text x="14" y="200" fill="#293D33" font-family="Consolas,monospace" font-size="2.8" >FIELD / AN ORIGINAL EDITORIAL SPECIMEN</text></svg>