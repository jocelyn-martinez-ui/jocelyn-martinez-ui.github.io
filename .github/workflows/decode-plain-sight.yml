name: Reconstruct PLAIN SIGHT assets
on:
  push:
    branches: [publish-plain-sight-2026]
    paths:
      - '.plain-sight-transfer/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore original website files and publications
        run: python3 .github/scripts/decode-plain-sight.py
      - name: Commit restored assets to review branch
        shell: bash
        run: |
          if [ -d .plain-sight-transfer ]; then
            echo 'Transfer remains; refusing to publish an incomplete project'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- plain-sight .plain-sight-transfer
          if ! git diff --cached --quiet; then
            git commit -m "Restore original PLAIN SIGHT website, images, PDFs and editable artwork"
            git push origin HEAD:publish-plain-sight-2026
          fi
