name: Portfolio quality
on:
  push:
    branches: [main, plain-sight-editorial-v2]
  pull_request:
permissions:
  contents: read
jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check portfolio routes and evidence boundaries
        run: node --test tests/portfolio-paths.test.mjs tests/plain-sight-edition2.test.mjs
