name: Portfolio quality
on:
  push:
    branches: [main, plain-sight-editorial-v2]
  pull_request:
permissions:
  contents: read
jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check changed interaction scripts
        run: |
          node --check work-paths.js
          node --check experiences/experience.js
          node --check psychictally-case.js
          node --check plain-sight/assets/app.js
      - name: Check routes, workflow states and artifact integrity
        run: node --test tests/*.test.mjs proof/*.test.mjs proof/marketing/qa.test.mjs nodo/qa.test.mjs
