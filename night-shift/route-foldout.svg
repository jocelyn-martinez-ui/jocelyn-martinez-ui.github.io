<svg xmlns="http://www.w3.org/2000/svg" width="792" height="1224" viewBox="0 0 792 1224" role="img" aria-labelledby="title desc"><title id="title">Night Shift route foldout</title><desc id="desc">Six fictional venues on two routes. East Dock Studio is the second stop on the quiet route.</desc><rect x="0" y="0" width="792" height="1224" rx="0" fill="#f4f0df"/><rect x="0" y="0" width="792" height="41" rx="0" fill="#191c1b"/><text x="42" y="28" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#f8f4df" font-weight="700" letter-spacing="3">NIGHT SHIFT  /  FOLDOUT MAP</text><text x="37" y="144" font-family="Arial, Helvetica, sans-serif" font-size="82" fill="#191c1b" font-weight="800" letter-spacing="-4">Follow the</text><text x="37" y="226" font-family="Arial, Helvetica, sans-serif" font-size="82" fill="#191c1b" font-weight="800" letter-spacing="-4">signal.</text><text x="44" y="291" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#191c1b" font-weight="400" >Two routes through the after-hours city.</text><text x="44" y="325" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#191c1b" font-weight="400" >Read the stops from left to right.</text><path d="M264 376V1003" fill="none" stroke="#c7c4b6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 10"/><path d="M528 376V1003" fill="none" stroke="#c7c4b6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 10"/><text x="44" y="431" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ba3e2f" font-weight="700" letter-spacing="2">A  /  SOCIAL</text><path d="M73 515 L375 601 L652 485" fill="none" stroke="#ba3e2f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><circle cx="73" cy="515" r="17" fill="#ba3e2f"/><text x="73" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="73" y="563" font-family="Arial, Helvetic