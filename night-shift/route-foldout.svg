, Helvetica, sans-serif" font-size="21" fill="#191c1b" font-weight="700" text-anchor="middle">Blue Hour Hall</text><path d="M42 1019H750" fill="none" stroke="#191c1b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><text x="44" y="1076" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#283f94" font-weight="700" letter-spacing="-1">East Dock Studio</text><text x="44" y="1121" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#191c1b" font-weight="400" >Route B  /  second stop  /  after Night Library</text><text x="44" y="1181" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#191c1b" font-weight="400" >Fictional venues   ·   Illustrated route diagram   ·   Guide p. 8</text></svg>
