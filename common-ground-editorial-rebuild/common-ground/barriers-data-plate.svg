<svg xmlns="http://www.w3.org/2000/svg" width="840" height="840" viewBox="0 0 840 840" role="img" aria-labelledby="title desc"><title id="title">Barriers to cultural participation</title><desc id="desc">Six illustrative percentages. Schedule or lack of time is the largest at 44 percent, followed by cost uncertainty at 38 percent.</desc><rect x="0" y="0" width="840" height="840" rx="0" fill="#f4efe4"/><text x="44" y="54" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#304a3f" font-weight="700" letter-spacing="2.6">COMMON GROUND</text><path d="M44 77H796" fill="none" stroke="#304a3f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><text x="42" y="161" font-family="Georgia, Times New Roman, serif" font-size="51" fill="#304a3f" font-weight="400" letter-spacing="-1.8">What keeps people away?</text><text x="44" y="212" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#304a3f" font-weight="700" >Illustrative survey model</text><text x="44" y="246" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#304a3f" font-weight="400" >Share of modeled respondents naming each barrier (%)</text><text x="44" y="319" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#304a3f" font-weight="400" >Schedule or lack of time</text><rect x="364" y="302" width="350" height="13" rx="0" fill="#d7d7ca"/><rect x="364" y="302" width="308.0" height="13" rx="0" fill="#a6633f"/><text x="789" y="319" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#304a3f" font-weight="700" text-anchor="end">44%</text><text x="44" y="386" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#304a3f" font-weight="400" >Cost uncertainty</text><rect x="364" y="369" width="350" height="13" rx="0" fill="#d7d7ca"/><rect x="364" y="369" width="266.0" height="13" rx="0" fill="#304a3f"/><text x="789" y="386" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#304a3f" font-weight="700" text-anchor="end">38%</text><text x="44" y="453" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#304a3f" font-weight="400" >Transportation complexity</text><rect x="364" y="436" width="350" height="13" rx="0" fill="#d7d7ca"/><rect x="364" y="436" width="189.0" height="13" rx="0" fill="#304a3f"/><text x="789" y="453" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#304a3f" font-weight="700" text-anchor="end">27%</text><text x="44" y="520" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#304a3f" font-weight="400" >Could not find clear information</text><rect x="364" y="503" width="350" height="13" rx="0" fill="#d7d7ca"/><rect x="364" y="503" width="154.0" height="13" rx="0" fill="#304a3f"/><text x="789" y="520" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#304a3f" font-weight="700" text-anchor="end">22%</text><text x="44" y="587" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#304a3f" font-weight="400" >No one to attend with</text><rect x="364" y="570" width="350" height="13" rx="0" fill="#d7d7ca"/><rect x="364" y="570" width="126.0" height="13" rx="0" fill="#304a3f"/><text x="789" y="587" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#304a3f" font-weight="700" text-anchor="end">18%</text><text x="44" y="654" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#304a3f" font-weight="400" >Accessibility concern</text><rect x="364" y="637" width="350" height="13" rx="0" fill="#d7d7ca"/><rect x="364" y="637" width="84.0" height="13" rx="0" fill="#304a3f"/><text x="789" y="654" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#304a3f" font-weight="700" text-anchor="end">12%</text><text x="364" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#304a3f" font-weight="400" >0%</text><text x="714" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#304a3f" font-weight="400" text-anchor="end">50%</text><path d="M44 740H796" fill="none" 