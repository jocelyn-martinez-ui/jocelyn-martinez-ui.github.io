<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="111mm" height="154mm" viewBox="0 0 111 154" role="img" aria-labelledby="art-title"><title id="art-title">NODO A6 instruction insert, 3mm provisional bleed</title><rect width="111" height="154" fill="#F6F1E7"/><text x="10" y="17" font-family="Arial" font-weight="900" font-size="10" fill="#242C28">nodo.</text><text x="101" y="17" text-anchor="end" font-family="monospace" font-size="3.5" fill="#242C28">QUICK GUIDE / SAMPLE</text><path d="M10 23H101" stroke="#242C28" stroke-width=".7"/><text x="10" y="40" font-family="Arial" font-size="14.5" font-weight="900" fill="#242C28">FIND A ROUTE.</text><text x="10" y="47" font-family="Arial" font-size="4" fill="#242C28">A small visual guide to three passive desk accessories.</text><text x="10" y="63" font-family="monospace" font-size="4" font-weight="700" fill="#242C28">01 / CLIP</text><text x="10" y="69" font-family="Arial" font-size="3.6" fill="#242C28">Keep a cord end nearby.</text><g transform="translate(84 65) scale(0.53)"><rect x="-13" y="-7" width="26" height="14" rx="4" fill="#C9DED4" stroke="#242C28" stroke-width=".9"/><path d="M-10 -1H10M-10 2.7H10" stroke="#242C28" stroke-width="1"/><circle cx="-6" cy="-1" r="2.2" fill="#E85933"/><circle cx="6" cy="-1" r="2.2" fill="#E85933"/></g><path d="M10 73H101" stroke="#242C28" opacity=".6" stroke-width=".35"/><text x="10" y="89" font-family="monospace" font-size="4" font-weight="700" fill="#242C28">02 / WRAP</text><text x="10" y="95" font-family="Arial" font-size="3.6" fill="#242C28">Gather the loose length.</text><g transform="translate(84 91) scale(0.53)"><rect x="-14" y="-7" width="28" height="14" rx="7" fill="#C9DED4" stroke="#242C28" stroke-width=".9"/><path d="M-12 0Q0 -5 12 0" stroke="#E85933" stroke-width="4" fill="none"/><circle r="2.3" fill="#F6F1E7" stroke="#242C28" stroke-width=".9"/></g><path d="M10 99H101" stroke="#242C28" opacity=".6" stroke-width=".35"/><text x="10" y="115" font-family="monospace" font-size="4" font-weight="700" fill="#242C28">03 / GUIDE</text><text x="10" y="121" font-family="Arial" font-size="3.6" fill="#242C28">Choose a route across the desk.</text><g transform="translate(84 117) scale(0.53)"><rect x="-15" y="-5" width="30" height="10" rx="3.3" fill="#F5C85D" stroke="#242C28" stroke-width=".9"/><path d="M-11 0H11M-5 -5V5M5 -5V5" stroke="#242C28" stroke-width="1.5"/></g><path d="M10 125H101" stroke="#242C28" opacity=".6" stroke-width=".35"/><text x="10" y="146" font-family="monospace" font-size="2.9" fill="#242C28">CONCEPT OBJECTS / NO SAFETY OR ADHESIVE PERFORMANCE CLAIMS</text></svg>