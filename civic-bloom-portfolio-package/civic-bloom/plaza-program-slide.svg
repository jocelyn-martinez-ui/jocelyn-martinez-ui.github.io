<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Civic Bloom plaza program slide</title><desc id="desc">A presentation translation of the two destination and direction groupings from the sign.</desc><rect x="0" y="0" width="960" height="540" rx="0" fill="#fbf1d6"/><rect x="0" y="0" width="18" height="540" rx="0" fill="#143642"/><text x="60" y="61" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#143642" font-weight="700" letter-spacing="2.2">CIVIC BLOOM  /  PLAZA PROGRAM</text><text x="58" y="150" font-family="Georgia, Times New Roman, serif" font-size="56" fill="#143642" font-weight="400" letter-spacing="-2.2">Where would you like to go?</text><path d="M60 186H900" fill="none" stroke="#143642" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><circle cx="95" cy="276" r="35" fill="#ef7358"/><g transform="translate(95 276) rotate(0) scale(0.41)"><path d="M-50 -11H16L-4 -31L12 -47L59 0L12 47L-4 31L16 11H-50Z" fill="#143642" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></g><text x="158" y="274" font-family="Arial, Helvetica, sans-serif" font-size="46" fill="#143642" font-weight="700" letter-spacing="-1.5">Workshops</text><text x="160" y="312" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#143642" font-weight="400" >Turn right at the plaza directory.</text><circle cx="95" cy="401" r="35" fill="#8bc1db"/><g transform="translate(95 401) rotate(-90) scale(0.41)"><path d="M-50 -11H16L-4 -31L12 -47L59 0L12 47L-4 31L16 11H-50Z" fill="#143642" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></g><text x="158" y="398" font-family="Arial, Helvetica, sans-serif" font-size="46" fill="#143642" font-weight="700" letter-spacing="-1.5">Open studios</text><text x="160" y="436" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#143642" font-weight="400" >Continue straight through the plaza.</text><text x="899" y="499" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#143642" font-weight="400" text-anchor="end">Fictional festival program</text></svg>
